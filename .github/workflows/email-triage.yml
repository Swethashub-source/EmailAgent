name: Email Triage Automation

on:
  push:
    branches: [ main ]
  
  pull_request:
    branches: [ main ]
  
  # Run daily at 09:00 AM IST (03:30 AM UTC)
  schedule:
    - cron: '30 3 * * *'
  
  workflow_dispatch:

jobs:
  triage_emails:
    runs-on: ubuntu-latest
    environment: GOOGLE_CREDENTIALS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug repository variables
        run: |
          echo "OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}"
          echo "GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}"
          echo "TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}"
          echo "TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}"

      - name: Debug repository secrets
        run: |
          echo "GOOGLE_CREDENTIALS exists: ${{ vars.GOOGLE_CREDENTIALS != '' }}"
          echo "GOOGLE_TOKEN exists: ${{ vars.GOOGLE_TOKEN != '' }}"

      - name: Configure Google Cloud Credentials
        env:
          GOOGLE_CREDENTIALS: ${{ vars.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ vars.GOOGLE_TOKEN }}
        run: |
          python - <<'END'
          import os, json

          # Write credentials.json
          creds = os.environ["GOOGLE_CREDENTIALS"]
          with open('credentials.json', 'w', encoding='utf-8') as f:
              f.write(creds)

          # Write token.json
          token = os.environ["GOOGLE_TOKEN"]
          with open('token.json', 'w', encoding='utf-8') as f:
              f.write(token)

          # Validate both are valid JSON
          for fname in ('credentials.json', 'token.json'):
              with open(fname, 'r') as f:
                  json.load(f)
              print(f"{fname} is valid JSON")
          END

          echo "credentials.json created, size: $(wc -c credentials.json)"
          echo "token.json created, size: $(wc -c token.json)"

      - name: Create .env file using repository variables
        run: |
          echo "OPENROUTER_API_KEY=${{ vars.OPENROUTER_API_KEY }}" > .env
          echo "GOOGLE_API_KEY=${{ vars.GOOGLE_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ vars.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ vars.TELEGRAM_CHAT_ID }}" >> .env
          echo "EMAIL_ADDRESS=${{ vars.EMAIL_ADDRESS }}" >> .env
          echo "SHEET_ID=${{ vars.SHEET_ID }}" >> .env

      - name: Verify .env file
        run: |
          echo -e "\n=== .env file contents ==="
          cat .env
          echo -e "\n=== Environment variables ==="
          cat .env | xargs -I {} sh -c 'echo {}'

      - name: Verify Python can read .env (fixed dotenv)
        run: |
          python - <<'END'
          import os, os.path
          from dotenv import load_dotenv

          dotenv_path = os.path.join(os.path.dirname(os.path.abspath(__file__)), '.env')
          load_dotenv(dotenv_path=dotenv_path)
          print("OPENROUTER_API_KEY loaded:", repr(os.getenv("OPENROUTER_API_KEY")))
          print("GOOGLE_API_KEY loaded:", repr(os.getenv("GOOGLE_API_KEY")))
          print("TELEGRAM_BOT_TOKEN loaded:", repr(os.getenv("TELEGRAM_BOT_TOKEN")))
          print("TELEGRAM_CHAT_ID loaded:", repr(os.getenv("TELEGRAM_CHAT_ID")))
          END

      - name: Run Email Triage
        run: python email_triage.py

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json
          rm -f token.json
          rm -f .env
