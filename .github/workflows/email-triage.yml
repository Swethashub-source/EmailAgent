name: Email Triage Automation

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Run daily at 09:00 AM IST (03:30 AM UTC)
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

jobs:
  triage_emails:
    runs-on: ubuntu-latest
    environment: GOOGLE_CREDENTIALS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug repository variables
        run: |
          echo "OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}"
          echo "TELEGRAM_BOT_TOKENS: ${{ vars.TELEGRAM_BOT_TOKENS }}"
          echo "TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}"

      - name: Debug repository secrets
        run: |
          echo "TELEGRAM_CHAT_ID exists: ${{ vars.TELEGRAM_CHAT_ID != '' }}"

      - name: Configure Google Cloud Credentials
        env:
          GOOGLE_CREDENTIALS: ${{ vars.GOOGLE_CREDENTIALS }}
          TOKEN_1: ${{ vars.TOKEN_SWETHASAID }}
          TOKEN_2: ${{ vars.TOKEN_SWETHASAIDAKUPATI }}
        run: |
          python - <<'END'
          import os

          # Write credentials.json
          with open('credentials.json', 'w') as f:
              f.write(os.environ["GOOGLE_CREDENTIALS"])

          # Write token for account 1
          if os.environ.get("TOKEN_1"):
              with open('token_swethasaid@gmail.com.json', 'w') as f:
                  f.write(os.environ["TOKEN_1"])

          # Write token for account 2
          if os.environ.get("TOKEN_2"):
              with open('token_swethasaidakupati@gmail.com.json', 'w') as f:
                  f.write(os.environ["TOKEN_2"])
          END

      - name: Create .env file using repository variables
        run: |
          echo "OPENROUTER_API_KEY=${{ vars.OPENROUTER_API_KEY }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ vars.TELEGRAM_CHAT_ID }}" >> .env
          echo "EMAIL_ACCOUNTS=${{ vars.EMAIL_ACCOUNTS }}" >> .env
          echo "SHEET_IDS=${{ vars.SHEET_IDS }}" >> .env
          echo "TELEGRAM_BOT_TOKENS=${{ vars.TELEGRAM_BOT_TOKENS }}" >> .env

      - name: Verify .env file
        run: |
          echo -e "\n=== .env file contents ==="
          cat .env
          echo -e "\n=== Environment variables ==="
          cat .env | xargs -I {} sh -c 'echo {}'

      - name: Verify Python can read .env (fixed dotenv)
        run: |
          python - <<'END'
          import os, os.path
          from dotenv import load_dotenv

          dotenv_path = os.path.join(os.path.dirname(os.path.abspath(__file__)), '.env')
          load_dotenv(dotenv_path=dotenv_path)
          print("OPENROUTER_API_KEY loaded:", repr(os.getenv("OPENROUTER_API_KEY")))
          print("TELEGRAM_BOT_TOKENS loaded:", repr(os.getenv("TELEGRAM_BOT_TOKENS")))
          print("TELEGRAM_CHAT_ID loaded:", repr(os.getenv("TELEGRAM_CHAT_ID")))
          END

      - name: Run Email Triage
        run: python email_triage.py

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json
          rm -f token.json
          rm -f .env
