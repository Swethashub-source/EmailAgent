name: Email Triage Automation

on:
  # Run on push to main branch
  push:
    branches: [ main ]
  
  # Run on pull request to main branch
  pull_request:
    branches: [ main ]
  
  # Run daily at 09:00 AM IST (03:30 AM UTC)
  schedule:
    - cron: '30 3 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  triage_emails:
    runs-on: ubuntu-latest
    environment: Google Credentials  # Specify the environment to use its secrets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Google Cloud Credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}' > token.json

      - name: Create .env file
        run: |
          cat <<'EOF' > .env
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF

      - name: Verify .env file
        run: cat .env

      - name: Run Email Triage
        run: python email_triage.py

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json
          rm -f token.json
          rm -f .env
